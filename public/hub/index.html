<!doctype html>
<html lang="en-NZ">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>Topic | Executive Frame Learning Hub</title>
  <meta name="robots" content="noindex">
  <link rel="icon" href="/assets/brand/app-icon-slate.svg" type="image/svg+xml">
  <link rel="preload" href="/assets/fonts/figtree-300.woff2" as="font" type="font/woff2" crossorigin>
  <link rel="stylesheet" href="/assets/css/tokens.css">
  <link rel="stylesheet" href="/assets/css/base.css">
  <link rel="stylesheet" href="/assets/css/hub.css">
  <script type="module" src="/assets/js/layout.js"></script>
  <script type="module" src="/assets/js/hub.js"></script>
</head>
<body>
  <!-- Template for every topic. /hub/<slug>/ is rewritten here by firebase.json; the content comes from /content/topics/<slug>.json. -->
  <ef-header current="library"></ef-header>
  <main id="main">
    <div class="wrap wrap-narrow">

      <section id="v-loading" class="loading">
        <span class="brand-mark pulse" data-loading-mark></span>
        <p role="status">Opening the topic</p>
      </section>

      <section id="v-missing" class="panel stack" hidden>
        <h1 class="t-title" tabindex="-1" id="missing-title">This topic is not available</h1>
        <p id="missing-text">It may have moved, or it is not part of your membership.</p>
        <a class="btn btn-primary" href="/library/">Back to the library</a>
      </section>

      <section id="v-hub" hidden>
        <div class="hub-top">
          <a href="/library/" class="t-ui">Back to the library</a>
          <span id="hub-tags"></span>
        </div>
        <h1 id="hub-title" class="t-display visually-hidden"></h1>
        <div class="hub-progress" aria-hidden="true"><span id="hub-bar"></span></div>
        <article id="stage" class="panel hub-step" tabindex="-1" aria-live="polite"></article>
        <nav class="hub-controls" aria-label="Topic steps">
          <button id="btn-prev" class="btn" type="button">Back</button>
          <span id="hub-count" class="hub-count t-caption" aria-live="polite"></span>
          <button id="btn-next" class="btn btn-primary" type="button">Next</button>
        </nav>
      </section>

    </div>
  </main>
  <ef-footer></ef-footer>
</body>
</html>
